name: salonat_client
description: "Salonat, the app clients book salon appointments with."
publish_to: 'none'

# <version>+<build number>. The version is the one in CHANGELOG.md; the build number goes up with every
# build sent to the stores. They become versionName/versionCode on Android and
# CFBundleShortVersionString/CFBundleVersion on iOS.
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  # The HTTP client salon-backend is called with.
  dio: ^5.11.1
  flutter:
    sdk: flutter
  # Holds the app's state, such as who is signed in, and hands screens their repositories.
  flutter_riverpod: ^3.4.3
  # Routes: a path per screen, the tabs, and sending signed-out clients to sign in.
  go_router: ^18.1.1
  # The app's line icons; the design's set is drawn in the same style.
  lucide_icons_flutter: ^3.1.25

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Outfit's licence, shown on the app's licences page.
    - assets/fonts/outfit/OFL.txt

  # Outfit, bundled rather than downloaded so the app looks the same offline. The design uses only
  # these three weights.
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/outfit/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/outfit/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/outfit/Outfit-SemiBold.ttf
          weight: 600

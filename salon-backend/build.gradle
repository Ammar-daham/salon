plugins {
    id 'java'
    id 'war'
    id 'org.springframework.boot' version '4.0.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'salon.com'
// version comes from gradle.properties
description = 'salon'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    compileOnly 'org.projectlombok:lombok'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    // Compiled against, for the name of the constraint a write broke (dao.Constraints).
    implementation 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat-runtime'
    testImplementation 'org.springframework.boot:spring-boot-starter-jdbc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ./gradlew javadoc writes the API reference to build/docs/javadoc; start at the controller package.
tasks.named('javadoc') {
    options.encoding = 'UTF-8'
    options.windowTitle = "Salonat API ${version}"
    options.docTitle = "Salonat API ${version}"
    // Every check but one: the classes that aren't part of the API needn't all have a comment.
    options.addBooleanOption('Xdoclint:all,-missing', true)
}

tasks.named('test') {
    useJUnitPlatform()
    // ./gradlew test -PrunKnownIssues also runs the @Disabled KnownIssuesTest cases, to check they still fail.
    if (project.hasProperty('runKnownIssues')) {
        systemProperty 'junit.jupiter.conditions.deactivate', 'org.junit.*DisabledCondition'
    }
}

name: CI

# BE-31: every pull request must build both apps and run the backend test suite
# before it can be merged. Pushes to main re-run the same checks so a merge that
# only passed against a stale base is caught immediately.
on:
  pull_request:
  push:
    branches: [main]

# A new push to a branch cancels the run still in flight for the previous one.
# Runs on main are left alone so every merged commit keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  salon-backend:
    name: salon-backend (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: salon-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Fails the build if gradle-wrapper.jar does not match a published Gradle release.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      # `build` compiles main + test, runs the Testcontainers suite (Docker is
      # preinstalled on ubuntu-latest) and assembles the war. The @Disabled
      # KnownIssuesTest cases stay disabled here: they assert bugs that are still
      # open, so running them would make CI permanently red.
      - name: Build and test
        run: ./gradlew build

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: salon-backend-test-report
          path: salon-backend/build/reports/tests/test
          if-no-files-found: ignore

  admin-panel:
    name: admin-panel (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin-panel
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin-panel/package-lock.json

      # `npm ci` (not `npm install`) so a package.json/package-lock.json mismatch
      # fails the build instead of being silently papered over.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  docker-compose:
    name: docker compose (both images)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # BE-40: both images build, the stack comes up healthy, the demo data still fits the schema, and
      # its super admin can sign in. The seed stops at its first error, so a migration it no longer
      # fits fails here rather than on someone's first `docker compose --profile demo up`.
      - name: Build the images and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Load the demo data
        run: docker compose --profile demo run --rm demo-data

      - name: The panel answers, and the demo super admin signs in
        run: |
          curl -fsS -o /dev/null http://localhost:3000/signin
          curl -fsS -o /dev/null -H 'Content-Type: application/json' \
            -d '{"email": "superadmin@salon.example.com", "password": "Password123!"}' \
            http://localhost:8081/api/v1/auth/login

      - name: Show the logs
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose --profile demo down --volumes
